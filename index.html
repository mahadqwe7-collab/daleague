<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA League | Season Hub & Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07111f; --panel:#102238; --line:#20344a;
  --text:#f3f7fc; --muted:#8da2b9; --gold:#f5b942;
  --teal:#27d3b0; --purple:#b39aff; --red:#ff5555;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:radial-gradient(ellipse at top,#12304a,transparent 45%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{width:min(1150px,92%);margin:auto}
header{position:sticky;top:0;background:#07111ff2;border-bottom:1px solid var(--line);z-index:10}
nav{min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:900;letter-spacing:2px}
.brand span{color:var(--gold)}
.links{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.links a{font-size:12px;color:#c3d0df;font-weight:700}
.links a:hover{color:var(--gold)}
.admin-nav-btn{background:var(--gold);color:#111827!important;padding:6px 14px;border-radius:20px;font-weight:800!important;cursor:pointer}

.hero{padding:70px 0 45px}
.eyebrow,.tag{display:inline-block;border:1px solid #f5b94255;background:#f5b94212;color:var(--gold);padding:7px 12px;border-radius:30px;font-size:11px;font-weight:800;letter-spacing:1px}
h1{font-size:clamp(42px,8vw,78px);line-height:1.02;letter-spacing:-3px;margin:22px 0}
.gradient{background:linear-gradient(90deg,var(--gold),var(--teal));color:transparent;-webkit-background-clip:text;background-clip:text}
.btn{display:inline-block;margin:8px 8px 0 0;padding:11px 16px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;border:none}
.primary{background:var(--gold);color:#111827}
.secondary{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.danger{background:var(--red);color:#fff}
section{padding:34px 0}
.section-head{margin-bottom:20px}
.kicker{color:var(--teal);font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
h2{font-size:clamp(25px,4vw,36px);margin:7px 0}
.sub{color:var(--muted);font-size:12px;line-height:1.8}
.season-grid,.team-grid,.player-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.season-card,.team-card,.player-card,.panel{background:linear-gradient(145deg,#11243a,#0b1828);border:1px solid var(--line);border-radius:16px;padding:20px}
.season-card{min-height:185px;cursor:pointer}
.season-card.active{border-color:var(--gold)}
.season-number{font-size:10px;color:var(--teal);font-weight:900;letter-spacing:2px}
.season-card h3{margin:15px 0 7px}
.season-card p,.team-card p{font-size:12px;color:var(--muted);line-height:1.7}
.status{display:inline-block;margin-top:10px;color:var(--gold);font-size:10px;font-weight:900;letter-spacing:1px}
.soon{color:var(--purple)}
.panel{padding:0;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
th{background:#102238;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}
tr:last-child td{border-bottom:0}
.gold{color:var(--gold);font-weight:800}
.purple{color:var(--purple);font-weight:800}
.player-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.player-card{padding:17px}
.player-name{font-weight:800;font-size:14px}
.player-meta{color:var(--muted);font-size:11px;margin-top:5px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:17px}
.metric{padding:10px;background:#071522;border:1px solid var(--line);border-radius:9px}
.metric span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}
.metric strong{display:block;font-size:16px;margin-top:5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
input,select{background:#0a1726;color:white;border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit;font-size:12px;width:100%}

/* Modal Overlay Styling */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:100}
.modal{background:#102238;border:1px solid var(--line);border-radius:16px;padding:25px;width:min(550px,90%);max-height:85vh;overflow-y:auto}
.admin-section{margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:15px}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.form-group label{font-size:11px;color:var(--muted)}

footer{border-top:1px solid var(--line);margin-top:35px;padding:25px 0;color:var(--muted);font-size:11px}
@media(max-width:800px){.season-grid,.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.links{gap:12px}}
@media(max-width:520px){nav{padding:14px 0}.links{gap:10px}.links a{font-size:10px}.hero{padding-top:45px}h1{letter-spacing:-2px}.season-grid,.team-grid,.player-grid{grid-template-columns:1fr}.section-head{margin-bottom:15px}}
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a class="brand" href="#home">DA <span>LEAGUE</span></a>
    <div class="links">
      <a href="#seasons">SEASONS</a>
      <a href="#standings">STANDINGS</a>
      <a href="#fixtures">FIXTURES</a>
      <a href="#players">PLAYERS</a>
      <a href="#teams">TEAMS</a>
      <a class="admin-nav-btn" onclick="openLoginModal()">ADMIN LOGIN</a>
    </div>
  </nav>
</header>

<main id="home">
<section class="hero">
  <div class="wrap">
    <span class="eyebrow">TOURNAMENT DASHBOARD</span>
    <h1>THE GAME.<br><span class="gradient">THE GLORY.</span></h1>
    <a class="btn primary" href="#standings">VIEW STANDINGS</a>
    <a class="btn secondary" href="#players">PLAYER RECORDS</a>
  </div>
</
